

name: Build Pixel Jump APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          
      - name: Diagnose Android export setup
        run: |
          echo "=== Godot ==="
          godot --version

          echo "=== Java ==="
          echo "$JAVA_HOME"
          java -version

          echo "=== Android SDK environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=== SDK folders ==="
          ls -la /usr/lib/android-sdk
          ls -la /usr/lib/android-sdk/build-tools
          ls -la /usr/lib/android-sdk/platforms
          ls -la /usr/lib/android-sdk/platform-tools

          echo "=== Godot settings ==="
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

          echo "=== Export templates ==="
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable"

          echo "=== Debug keystore ==="
          ls -l /root/debug.keystore
          
          mkdir -p "$HOME/.config"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          cp -a /root/.config/godot "$HOME/.config/"

          cp -a \
            /root/.local/share/godot/export_templates/4.3.stable \
            "$HOME/.local/share/godot/export_templates/"

          echo "Godot version:"
          godot --version

          echo "Android SDK:"
          ls -la /usr/lib/android-sdk

          echo "Build tools:"
          ls -la /usr/lib/android-sdk/build-tools

      - name: Check project files
        run: |
          test -f project.godot
          test -f Main.tscn
          test -f main.gd
          test -f export_presets.cfg

      - name: Import project
        run: |
          godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build

          godot --headless --verbose --path . \
            --export-debug "Android" build/PixelJump.apk

          test -s build/PixelJump.apk
          ls -lh build/PixelJump.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Jump-APK
          path: build/PixelJump.apk
          if-no-files-found: error
          
