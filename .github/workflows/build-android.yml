
name: Build Pixel Jump APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3

    env:
      HOME: /root
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Android environment
        run: |
          echo "=== Godot ==="
          godot --version

          echo "=== Java ==="
          java -version

          echo "=== Android SDK ==="
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/platforms"

          echo "=== Godot settings ==="
          find /root/.config/godot -maxdepth 2 -type f 2>/dev/null || true

          echo "=== Export templates ==="
          ls -la /root/.local/share/godot/export_templates/ || true

      - name: Check project files
        run: |
          test -f project.godot
          test -f Main.tscn
          test -f main.gd
          test -f export_presets.cfg

      - name: Import project
        run: |
          godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . \
            --export-debug "Android" build/PixelJump.apk
          test -s build/PixelJump.apk
          ls -lh build/PixelJump.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Jump-APK
          path: build/PixelJump.apk
          if-no-files-found: error
          
