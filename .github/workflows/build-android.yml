
name: Build Pixel Jump APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare Godot templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          cp -r /root/.config/godot ~/.config/ || true
          cp -r /root/.local/share/godot/export_templates/4.3.stable \
            ~/.local/share/godot/export_templates/

      - name: Import project
        run: |
          godot --headless --editor --path . --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" build/PixelJump.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Jump-APK
          path: build/PixelJump.apk
          if-no-files-found: error
          
