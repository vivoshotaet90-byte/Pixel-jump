
name: Build Pixel Jump APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking required files..."
          test -f project.godot
          test -f Main.tscn
          test -f main.gd
          test -f export_presets.cfg
          echo "All required files found."

      - name: Import project resources
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            barichello/godot-ci:4.3.0 \
            godot --headless --editor --path /project --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            barichello/godot-ci:4.3.0 \
            godot --headless --verbose --path /project \
            --export-debug "Android" /project/build/PixelJump.apk

          test -f build/PixelJump.apk
          ls -lh build/PixelJump.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Jump-APK
          path: build/PixelJump.apk
          if-no-files-found: error
          
