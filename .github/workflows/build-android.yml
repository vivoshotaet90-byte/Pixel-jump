
name: Build Pixel Jump APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3

    env:
      GODOT_VERSION: "4.3"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        run: |
          mkdir -p "$HOME/.config"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot/. "$HOME/.config/godot/" 2>/dev/null || true
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/" 2>/dev/null || true
          godot --version
          ls -la

      - name: Check project files
        run: |
          test -f project.godot
          test -f Main.tscn
          test -f main.gd
          test -f export_presets.cfg

      - name: Import project resources
        run: |
          godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . \
            --export-debug "Android" build/PixelJump.apk
          test -s build/PixelJump.apk
          ls -lh build/PixelJump.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Jump-APK
          path: build/PixelJump.apk
          if-no-files-found: error
          
