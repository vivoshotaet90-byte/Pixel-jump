
name: Build Pixel Jump APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build Android APK
        run: |
          mkdir -p build
          docker run --rm \
            -v "$PWD":/project \
            -w /project \
            barichello/godot-ci:4.3.0 \
            godot --headless --path /project \
            --export-debug Android /project/build/PixelJump.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Jump-APK
          path: build/PixelJump.apk
          if-no-files-found: error
          
